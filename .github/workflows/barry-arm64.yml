# project-barry: an aarch64 AppImage for testing on the AYN Thor (PB-OS).
# Same build environment and script as upstream's linux jobs; only this job
# runs for the fork's test branches.
name: barry-arm64

on:
  push:
    branches: [ "thor-*" ]
  workflow_dispatch:

jobs:
  linux-arm64-appimage:
    runs-on: ubuntu-24.04-arm
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: appimage
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-
      - name: Build
        run: ./.ci/linux.sh
      - name: Move AppImage to artifacts directory
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage
          path: artifacts/
